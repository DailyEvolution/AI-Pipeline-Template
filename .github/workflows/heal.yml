name: Heal loop
on:
  schedule: [{ cron: "0 */4 * * *" }]
  workflow_dispatch:

concurrency:
  group: heal-loop
  cancel-in-progress: false

# Dormant until `gh variable set PIPELINE_ENABLED --body true`. Nothing
# scheduled should fire on a repository whose secrets are not in place.
jobs:
  breaker:
    if: vars.PIPELINE_ENABLED == 'true'
    uses: ./.github/workflows/circuit-breaker.yml

  repair:
    needs: breaker
    if: vars.PIPELINE_ENABLED == 'true' && needs.breaker.outputs.state == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "/heal-oldest-t0"
          claude_args: "--max-turns 25 --model claude-opus-5"
